<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de classificação do recém-nascido</title>
  <desc id="desc">Quadro visual com idade gestacional, peso ao nascer e peso para idade gestacional.</desc>
  <rect width="1200" height="720" fill="#f7fbfa"/>
  <rect x="70" y="70" width="1060" height="580" rx="34" fill="#fff" stroke="#d7e7e3" stroke-width="4"/>
  <text x="105" y="130" font-family="Inter, Arial" font-size="42" font-weight="900" fill="#10211f">Classificação do RN</text>
  <g font-family="Inter, Arial" font-weight="800">
    <rect x="105" y="180" width="300" height="370" rx="24" fill="#e7f5f1"/>
    <text x="135" y="235" font-size="28" fill="#0b534e">Idade gestacional</text>
    <path d="M140 310h220" stroke="#0f766e" stroke-width="12" stroke-linecap="round"/>
    <circle cx="200" cy="310" r="18" fill="#f59e0b"/>
    <circle cx="300" cy="310" r="18" fill="#0f766e"/>
    <text x="132" y="375" font-size="23" fill="#10211f">&lt;37s: pré-termo</text>
    <text x="132" y="425" font-size="23" fill="#10211f">37-41s6d: termo</text>
    <text x="132" y="475" font-size="23" fill="#10211f">≥42s: pós-termo</text>
  </g>
  <g font-family="Inter, Arial" font-weight="800">
    <rect x="450" y="180" width="300" height="370" rx="24" fill="#fff7ed"/>
    <text x="480" y="235" font-size="28" fill="#9a3412">Peso ao nascer</text>
    <rect x="500" y="290" width="200" height="58" rx="12" fill="#fed7aa"/>
    <rect x="530" y="365" width="140" height="58" rx="12" fill="#fdba74"/>
    <rect x="560" y="440" width="80" height="58" rx="12" fill="#fb923c"/>
    <text x="482" y="570" font-size="22" fill="#10211f">2500 · 1500 · 1000 g</text>
  </g>
  <g font-family="Inter, Arial" font-weight="800">
    <rect x="795" y="180" width="300" height="370" rx="24" fill="#ecfeff"/>
    <text x="825" y="235" font-size="28" fill="#164e63">Peso × idade</text>
    <path d="M850 455C900 345 958 305 1040 255" fill="none" stroke="#be123c" stroke-width="8"/>
    <path d="M845 520C900 435 970 395 1050 365" fill="none" stroke="#be123c" stroke-width="8"/>
    <circle cx="890" cy="500" r="18" fill="#0f766e"/>
    <text x="835" y="302" font-size="23" fill="#10211f">Acima P90 = GIG</text>
    <text x="835" y="340" font-size="23" fill="#10211f">P10-P90 = AIG</text>
    <text x="835" y="378" font-size="23" fill="#10211f">Abaixo P10 = PIG</text>
  </g>
</svg>
