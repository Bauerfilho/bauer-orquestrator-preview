<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Fluxograma de tratamento da sífilis congênita</title>
  <desc id="desc">Sequência visual para avaliar tratamento materno, VDRL, exame físico, líquor e escolha de penicilina.</desc>
  <rect width="1200" height="760" fill="#f7fbfa"/>
  <text x="80" y="95" font-family="Inter, Arial" font-size="42" font-weight="900" fill="#10211f">Sífilis congênita: não comece pelo fim</text>
  <g font-family="Inter, Arial" font-weight="800" font-size="23">
    <rect x="85" y="145" width="1030" height="88" rx="22" fill="#0f766e"/>
    <text x="125" y="199" fill="#fff">1. Tratamento materno adequado?</text>
    <path d="M600 233v48" stroke="#0f766e" stroke-width="10" stroke-linecap="round"/>
    <rect x="85" y="280" width="480" height="120" rx="22" fill="#ffe4e6" stroke="#fecdd3" stroke-width="4"/>
    <text x="120" y="330" fill="#9f1239">Não adequado = sífilis congênita</text>
    <text x="120" y="365" font-size="20" fill="#58706c">Notificar + exame físico + exames completos</text>
    <rect x="635" y="280" width="480" height="120" rx="22" fill="#e7f5f1" stroke="#cce7e2" stroke-width="4"/>
    <text x="670" y="330" fill="#0b534e">Adequado: comparar VDRL RN × mãe</text>
    <text x="670" y="365" font-size="20" fill="#58706c">Duas diluições ou exame físico guiam a conduta</text>
    <path d="M325 400v48M875 400v48" stroke="#0f766e" stroke-width="10" stroke-linecap="round"/>
    <rect x="85" y="450" width="300" height="160" rx="22" fill="#ecfeff" stroke="#a5f3fc" stroke-width="4"/>
    <text x="120" y="505" fill="#164e63">Líquor alterado</text>
    <text x="120" y="545" font-size="20" fill="#58706c">VDRL LCR + ou células &gt;25</text>
    <text x="120" y="575" font-size="20" fill="#58706c">ou proteína &gt;150</text>
    <rect x="450" y="450" width="300" height="160" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="4"/>
    <text x="485" y="505" fill="#9a3412">Líquor normal</text>
    <text x="485" y="545" font-size="20" fill="#58706c">com outra alteração</text>
    <rect x="815" y="450" width="300" height="160" rx="22" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="4"/>
    <text x="850" y="505" fill="#166534">Tudo normal</text>
    <text x="850" y="545" font-size="20" fill="#58706c">menor risco imediato</text>
    <text x="122" y="675" fill="#164e63">Cristalina EV 10 dias</text>
    <text x="455" y="675" fill="#9a3412">Cristalina EV ou procaína IM</text>
    <text x="858" y="675" fill="#166534">Benzatina IM dose única</text>
  </g>
</svg>
