      <stop offset="1" stop-color="#fff3d8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1">
      <stop stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
