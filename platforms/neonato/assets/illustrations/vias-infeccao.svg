<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Vias de infecção neonatal</title>
  <desc id="desc">Ilustração com transmissão transplacentária, ascendente, comunitária e hospitalar.</desc>
  <rect width="1200" height="720" fill="#f7fbfa"/>
  <rect x="78" y="80" width="1044" height="560" rx="36" fill="#fff" stroke="#d7e7e3" stroke-width="4"/>
  <text x="120" y="145" font-family="Inter, Arial" font-size="40" font-weight="900" fill="#10211f">Como o RN pode se infectar?</text>
  <g transform="translate(150 210)">
    <path d="M190 40c115 30 135 178 54 255-74 70-214 30-230-86C1 110 76 10 190 40z" fill="#e7f5f1" stroke="#0f766e" stroke-width="6"/>
    <circle cx="180" cy="185" r="58" fill="#ffd7c7"/>
    <path d="M175 125c95-38 180 22 190 106" fill="none" stroke="#be123c" stroke-width="10" stroke-linecap="round"/>
    <path d="M285 84c-66 52-70 108-22 156" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
    <text x="360" y="85" font-family="Inter, Arial" font-size="26" font-weight="900" fill="#be123c">Transplacentária</text>
    <text x="360" y="135" font-family="Inter, Arial" font-size="24" font-weight="800" fill="#9a3412">Ascendente / intraparto</text>
  </g>
  <g font-family="Inter, Arial" font-weight="800">
    <rect x="705" y="235" width="320" height="110" rx="22" fill="#ecfeff" stroke="#a5f3fc" stroke-width="4"/>
    <text x="735" y="285" font-size="28" fill="#164e63">Pós-natal comunitária</text>
    <text x="735" y="323" font-size="20" fill="#58706c">casa, contato, amamentação</text>
    <rect x="705" y="385" width="320" height="110" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="4"/>
    <text x="735" y="435" font-size="28" fill="#9a3412">Hospitalar</text>
    <text x="735" y="473" font-size="20" fill="#58706c">UTI neonatal, cuidado invasivo</text>
  </g>
</svg>
