    <path d="M 48 396 A 352 132 -16 0 0 712 224" opacity="0.9" stroke-linecap="round"/>
  </g>
  <!-- o satélite: um ponto de estudo em órbita -->
  <circle cx="700" cy="231" r="17" fill="#1b0095"/>
</svg>
